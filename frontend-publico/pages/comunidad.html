<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Comunidad | Liceo Hernán Vargas Ramírez
  </title>

  <meta
    name="description"
    content="Conoce la comunidad educativa, la participación estudiantil, la cultura y la identidad del Liceo Hernán Vargas Ramírez."
  >

  <meta
    name="theme-color"
    content="#2b563a"
  >

  <!-- Estilos generales del sitio -->
  <link
    rel="stylesheet"
    href="../css/estilos.css"
  >

  <!-- Estilos específicos de Comunidad -->
  <link
    rel="stylesheet"
    href="../css/comunidad.css"
  >

  <!-- Responsive -->
  <link
    rel="stylesheet"
    href="../css/responsive.css"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    href="../assets/logos/logo-liceo.jpg"
  >
</head>

<body
  data-pagina="comunidad"
  data-pagina-publica="comunidad"
>

  <!-- ======================================================
       ENCABEZADO GENERAL
       ====================================================== -->

  <div id="encabezado"></div>


  <!-- ======================================================
       CONTENIDO PRINCIPAL
       ====================================================== -->

  <main id="contenidoComunidadPublico">

    <!-- ====================================================
         BANDA DE LA PÁGINA
         ==================================================== -->

    <section
      id="encabezadoComunidadPublico"
      class="banda"
    >

      <div class="contenedor">

        <p class="migas">
          <a href="../index.html">
            Inicio
          </a>

          /

          Comunidad
        </p>

        <h1 id="tituloEncabezadoComunidad">
          Comunidad
        </h1>

        <p id="descripcionEncabezadoComunidad">
          Conoce la vida institucional, la participación estudiantil,
          la cultura y la identidad de nuestra comunidad educativa.
        </p>

      </div>

    </section>


    <!-- ====================================================
         INTRODUCCIÓN
         ==================================================== -->

    <section
      id="seccionIntroComunidad"
      class="seccion comunidad-intro"
      data-seccion-clave="INTRO_COMUNIDAD"
      hidden
    >

      <div class="contenedor">

        <div
          id="contenidoIntroComunidad"
          class="comunidad-intro__contenido"
        >
        </div>

      </div>

    </section>


    <!-- ====================================================
         TARJETAS DE COMUNIDAD
         ==================================================== -->

    <section
      id="seccionListadoComunidad"
      class="seccion comunidad-seccion"
      hidden
    >

      <div
        id="listaComunidad"
        class="contenedor comunidad-lista"
        aria-live="polite"
      >
      </div>

    </section>


    <!-- ====================================================
         CIERRE
         ==================================================== -->

    <section
      id="seccionCierreComunidad"
      class="seccion comunidad-cierre"
      data-seccion-clave="CIERRE_COMUNIDAD"
      hidden
    >

      <div class="contenedor">

        <div
          id="contenidoCierreComunidad"
          class="comunidad-cierre__tarjeta"
        >
        </div>

      </div>

    </section>

  </main>


  <!-- ======================================================
       PIE DE PÁGINA
       ====================================================== -->

  <div id="pie"></div>


  <!-- ======================================================
       JAVASCRIPT GENERAL
       ====================================================== -->

  <script src="../js/main.js"></script>


  <!-- ======================================================
       JAVASCRIPT DE COMUNIDAD
       ====================================================== -->

  <script src="../js/comunidad.js"></script>

</body>

</html>
